

# Target properties

# track history : length of the trail
pasd.tar.trackhistory=9
# maximum value that track history can take
pasd.tar.trackhistory.max=50
# Initial font size of the track label. Can take the values: Standard, Large, XLarge, XXLarge
pasd.tar.tracklabel.fontsize=Standard
#Initial position of the track label that it is relative to and that is selected in the Track label position menu
pasd.tar.tracklabel.position=RelativeToTrack
#Initial position of track labels relative to screen and the initial position for when the Align to corner button is selected from the Track label position menu
pasd.tar.tracklabel.relative.to.screen=E
#Initial position of track labels relative to track and the initial position for when the Align from track button is selected from the Track label position menu
pasd.tar.tracklabel.relative.to.track=90
#Initial length of the track label leader line length and the initial length selected from the Track labels position menu.
pasd.tar.tracklabel.leaderline.length=Medium
#Length of the leader-line for length short in pixels
pasd.tar.tracklabel.leaderline.length.short=50
#Length of the leader-line for length medium in pixels
pasd.tar.tracklabel.leaderline.length.medium=100
#Length of the leader-line for length long in pixels
pasd.tar.tracklabel.leaderline.length.long=150
#Max age, in milliseconds, of the last mlat update for the target to be considered a track with mlat detecion when track reports any other detecion
pasd.tar.mlat.symbol.max.age.milliseconds=8130
#Max age, in milliseconds, of the last mlat update for the target to be considered a track with mlat detecion when track reports no other detecion
pasd.tar.mlat.track.max.age.milliseconds=22500

# Default font size of the track label. Can take the values: Standard, Large, XLarge, XXLarge
pasd.tar.tracklabel.default.fontsize=Large
# Pixel size of the Standard font for track label.
pasd.tar.tracklabel.standard.font.pixelsize=14
# Pixel size of the Large font for track label.
pasd.tar.tracklabel.large.font.pixelsize=16
# Pixel size of the XLarge font for track label.
pasd.tar.tracklabel.xlarge.font.pixelsize=18
# Pixel size of the XXLarge font for track label.
pasd.tar.tracklabel.xxlarge.font.pixelsize=24
# Font name of the Standard font for track label.
pasd.tar.tracklabel.standard.font.name=Standard
# Font name of the Large font for track label.
pasd.tar.tracklabel.large.font.name=Large
# Font name of the XLarge font for track label.
pasd.tar.tracklabel.xlarge.font.name=XLarge
# Font name of the XXLarge font for track label.
pasd.tar.tracklabel.xxlarge.font.name=Tower

#Relevant control states for which the field is visible when unselected
pasd.tar.tracklabel.unselected.relevant.cs=Concerned TransferInInitiated RequestInInitiated Assumed TransferOutInitiated RequestOutInitiated
pasd.tar.tracklabel.unselected.aerodrome.info.relevant.cs=Concerned TransferInInitiated RequestInInitiated TransferOutInitiated RequestOutInitiated

#Flight rules for which the flight rule is visible
pasd.tar.tracklabel.flightrules.visible=V X Z

#Relevant aerodromes for manual sequencing
pasd.tar.tracklabel.manual.sequencing.aerodromes=BIRK BIKF